; Stage 1: boot the 4.3BSD miniroot, restore the root dump onto a fresh RA81.
set cpu 8m
set rq0 ra81
attach rq0 miniroot.work
set rq1 ra81
attach -n rq1 nancy.dsk
set rq2 dis
set rq3 dis
set rp dis
set lpt dis
set rl dis
set tq dis
set tu dis
attach -r ts ../dist/43.tap
set tti 7b
set tto 7b
load -o ../dist/boot42 0
d r10 9
d r11 0
expect ": "
run 2
send "ra(0,0)vmunix\r"
expect "# "
go
send "cd /dev\r./MAKEDEV ra1\rcd /\r"
expect "# "
go
send "disk=ra1 type=ra81 tape=ts xtr\r"
expect "update the cassette"
go
expect "# "
go
send "sync\rsync\rsync\r"
expect "# "
go
exit
