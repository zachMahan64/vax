; Shared hardware config: a VAX-11/780 with 8 MB RAM, one RA81 on a UDA50,
; a TS11 tape drive, and console at 7-bit like a real VT100 on the console port.
set cpu 8m
set cpu idle=32V
set rq0 ra81
attach rq0 nancy.dsk
set rq1 dis
set rq2 dis
set rq3 dis
set rp dis
set lpt dis
set rl dis
set tq dis
set tu dis
attach -r ts ../dist/43.tap
set tti 7b
set tto 7b
load -o ../dist/boot42 0
d r10 9
d r11 0
