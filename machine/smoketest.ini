; Non-interactive check: multiuser boot, log in, run a few commands, halt.
do common.ini
expect ": " send "ra(0,0)vmunix\r"; go
expect "login: "
run 2
send "root\r"
expect "# "
go
send "uname -a; hostname; df; ls /usr/games | head -5; echo 'main(){printf(\"hello from a VAX\\n\");}' > /tmp/h.c && cc -o /tmp/h /tmp/h.c && /tmp/h\r"
expect "hello from a VAX"
go
expect "# "
go
send "sync; sync; halt\r"
expect "halting"
go
exit
