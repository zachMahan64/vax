; Stage 3: post-install tweaks (DZ11 terminal devices, hostname "nancy").
do common.ini
expect ": " send "ra(0,0)vmunix\r"; go
expect "login: "
run 2
send "root\r"
expect "# "
go
send "cd /dev; sh ./MAKEDEV dz0; cd /; sed 's/myname.my.domain/nancy/' /etc/rc.local > /tmp/rc && cp /tmp/rc /etc/rc.local; grep hostname /etc/rc.local; ls /dev/tty0*; echo DONE\r"
expect "DONE\r"
go
expect "# "
go
send "sync; sync; halt\r"
expect "halting"
go
exit
