; Stage 2: boot the installed root, make /usr and /home, restore /usr from tape.
do common.ini
expect ": "
run 2
send "ra(0,0)vmunix\r"
expect "# "
go
send "cd /dev\rsh ./MAKEDEV ts0\rsync\rcd /\r"
expect "# "
go
send "newfs ra0h ra81\r"
expect "286208,"
go
expect "# "
go
send "mount /dev/ra0h /usr\rcd /usr\rmkdir sys\rcd sys\rmt rew\rmt fsf 3\r"
expect "# "
go
send "tar xpbf 20 /dev/rmt12\r"
expect "# "
go
send "cd ..\rmt fsf\r"
expect "# "
go
send "tar xpbf 20 /dev/rmt12\r"
expect "# "
go
send "cd /\rchmod 755 / /usr /usr/sys\rrm -rf sys\rln -s /usr/sys sys\rumount /dev/ra0h\r"
expect "# "
go
send "fsck /dev/rra0h\r"
expect "fragmentation)"
go
expect "# "
go
send "cd /etc\rcp fstab.ra81 fstab\rnewfs ra0g ra81\r"
expect "514944,"
go
expect "# "
go
send "sync\rsync\rreboot\r"
expect "syncing disks... done"
go
exit
