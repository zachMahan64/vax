; Normal boot: 4.3BSD multiuser on "Nancy". Log in as root (no password).
; Extra terminals: `telnet localhost 2323` (8 DZ11 serial lines).
; To stop the emulator: press Ctrl-E, then type `q` at the sim> prompt.
; (Inside BSD, run `sync; sync; halt` first so the disk stays clean.)
do common.ini
set dz lines=8
set dz 7b
attach dz 2323
expect ": " send "ra(0,0)vmunix\r"; go
run 2
