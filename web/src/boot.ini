; Browser boot: the same machine as machine/common.ini, minus the install tape.
; DZ11 lines 0 and 1 (/dev/tty00, tty01) are the page's extra terminals.
set cpu 8m
set cpu idle=32V
set rq0 ra81
attach rq0 nancy.dsk
set rq1 dis
set rq2 dis
set rq3 dis
set rp dis
set lpt dis
set rl dis
set tq dis
set tu dis
set tti 7b
set tto 7b
set dz lines=8
set dz 7b
attach dz line=0,connect=term0
attach dz line=1,connect=term1
load -o boot42 0
d r10 9
d r11 0
expect ": " send "ra(0,0)vmunix\r"; go
run 2
